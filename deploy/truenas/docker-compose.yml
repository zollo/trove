# ─────────────────────────────────────────────────────────────────────────
# Trove — TrueNAS SCALE (Electric Eel 24.10+) deployment
#
# Optimized for TrueNAS:
#   * Uses prebuilt images from GHCR (TrueNAS does not build images).
#   * Only the frontend port is published; everything else is internal.
#   * The frontend reverse-proxies /api and /mcp to the backend, so you reach the
#     whole app (UI, REST API, MCP endpoint) on ONE port with no CORS.
#   * Postgres (the source of truth, including uploaded resumes) lives on a host
#     dataset for snapshots/backups.
#
# Recommended install path: TrueNAS Apps → "Custom App" → Install via YAML,
# or a compose manager like Dockge. Provide the variables via a .env file
# (see .env.example) or by editing the values below.
# ─────────────────────────────────────────────────────────────────────────
name: trove

services:
  postgres:
    image: postgres:16-alpine
    container_name: trove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trove}
      POSTGRES_DB: ${POSTGRES_DB:-trove}
      # Keep data in a subdir so the mounted dataset root can hold other files.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Host dataset — snapshot/backup this path. Change 'tank' to your pool.
      - ${TROVE_DATA:-/mnt/tank/apps/trove}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trove}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zollo/trove-backend:${TROVE_TAG:-latest}
    container_name: trove-backend
    restart: unless-stopped
    # Every value below is a plain environment variable you can override from any
    # source: a .env file (Dockge / `docker compose`), the shell, or the TrueNAS
    # Custom App "Environment Variables" section. SECRET_KEY is required; leave
    # BOOTSTRAP_HEADHUNTER_PASSWORD blank to have one generated and printed in
    # the backend log on first start (see .env.example / README).
    environment:
      TROVE_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY, e.g. openssl rand -hex 32}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-trove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trove}
      POSTGRES_DB: ${POSTGRES_DB:-trove}
      CORS_ORIGINS: ${TROVE_PUBLIC_URL:-http://localhost:30081}
      TROVE_PUBLIC_URL: ${TROVE_PUBLIC_URL:-http://localhost:30081}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOW_CANDIDATE_REGISTRATION: ${ALLOW_CANDIDATE_REGISTRATION:-true}
      BOOTSTRAP_HEADHUNTER_EMAIL: ${BOOTSTRAP_HEADHUNTER_EMAIL:-headhunter@example.com}
      BOOTSTRAP_HEADHUNTER_PASSWORD: ${BOOTSTRAP_HEADHUNTER_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/zollo/trove-frontend:${TROVE_TAG:-latest}
    container_name: trove-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # The only published port. Open http://<truenas-ip>:${TROVE_PORT}.
      - "${TROVE_PORT:-30081}:80"
    # Explicit healthcheck with a start_period so TrueNAS marks it healthy
    # promptly and the app leaves the "Deploying" state.
    # Use 127.0.0.1 (not "localhost"): busybox wget may resolve localhost to
    # ::1 first, but nginx listens on IPv4 only, so the check would fail.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
