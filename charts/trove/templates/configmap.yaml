apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trove.fullname" . }}-config
  labels:
    {{- include "trove.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  POSTGRES_HOST: {{ include "trove.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "trove.postgresPort" . | quote }}
  POSTGRES_USER: {{ include "trove.postgresUser" . | quote }}
  POSTGRES_DB: {{ include "trove.postgresDatabase" . | quote }}
