[project]
name = "trove-backend"
version = "0.1.0"
description = "Trove — a job-search portal shared by candidates and their headhunters (human or AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    # MCP server (streamable HTTP), mounted at /mcp.
    "mcp==2.3.0",
    # Resume text extraction (PDF / DOCX) so AI headhunters can read resumes.
    "pypdf==6.21.1",
    "python-docx==1.2.0",
    # Google sign-in: redeem OAuth codes at Google's token endpoint.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "aiosqlite==0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# `pip install .` leaves a build/ copy of the package behind.
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP037",  # keep quoted forward refs; SQLAlchemy resolves them by name
]

[tool.ruff.lint.isort]
# Make section detection deterministic regardless of the runner's cwd.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are largely generated: don't be strict about formatting.
"app/migrations/**" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
